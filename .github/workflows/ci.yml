name: CI

on:
  push:
    branches:
      - main
      - "best-of-forks-*"
  pull_request:

jobs:
  python-checks:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q steam_auto_cracker_gui.py sac_cli.py sac_lib

      - name: Import GUI dependencies
        run: python -c "import ttkbootstrap as tk; import ttkbootstrap; from tkinterdnd2 import TkinterDnD; assert hasattr(tk, 'Text'); assert hasattr(ttkbootstrap.themes.standard, 'STANDARD_THEMES'); print('GUI dependencies OK')"

      - name: Regression test ttkbootstrap compatibility hook
        shell: python
        run: |
          import runpy
          runpy.run_path(".github/runtime_hooks/ttkbootstrap_tk_constants.py")
          import ttkbootstrap as tk
          expected = {
              "END": "end",
              "NORMAL": "normal",
              "DISABLED": "disabled",
              "LEFT": "left",
              "RIGHT": "right",
              "BOTH": "both",
              "Y": "y",
          }
          for name, value in expected.items():
              assert getattr(tk, name) == value, (name, getattr(tk, name, None))
          print("ttkbootstrap compatibility hook OK")


      - name: Regression test restore manifest and preservation
        shell: python
        run: |
          import os
          import sys
          import tempfile

          sys.path.insert(0, os.getcwd())

          from sac_lib.restore import (
              discover_legacy_backups,
              load_manifest,
              record_change,
              remove_manifest,
              restore_entries,
              safe_join,
          )

          with tempfile.TemporaryDirectory() as root:
              original = os.path.join(root, "steam_api.dll")
              backup = os.path.join(root, "steam_api.dll.bak")

              with open(original, "w", encoding="utf-8") as handle:
                  handle.write("modified")
              with open(backup, "w", encoding="utf-8") as handle:
                  handle.write("original")

              record_change(root, original, backup)
              manifest = load_manifest(root)
              assert len(manifest["entries"]) == 1

              result = restore_entries(root, manifest["entries"])
              assert result["skipped"] == []
              assert result["restored"] == ["steam_api.dll"]
              assert len(result["preserved"]) == 1

              with open(original, "r", encoding="utf-8") as handle:
                  assert handle.read() == "original"
              with open(os.path.join(root, result["preserved"][0]), "r", encoding="utf-8") as handle:
                  assert handle.read() == "modified"

              remove_manifest(root)
              assert load_manifest(root) is None

          with tempfile.TemporaryDirectory() as root:
              created = os.path.join(root, "SteamConfig.ini")
              with open(created, "w", encoding="utf-8") as handle:
                  handle.write("generated")

              record_change(root, created, None)
              manifest = load_manifest(root)
              result = restore_entries(root, manifest["entries"])
              assert result["removed_created"] == ["SteamConfig.ini"]
              assert not os.path.exists(created)
              assert len(result["preserved"]) == 1
              with open(os.path.join(root, result["preserved"][0]), "r", encoding="utf-8") as handle:
                  assert handle.read() == "generated"

          with tempfile.TemporaryDirectory() as root:
              original = os.path.join(root, "game.exe")
              backup = original + ".bak"
              open(original, "wb").close()
              open(backup, "wb").close()

              found = discover_legacy_backups(root, exe_backup_suffix=".bak")
              assert {
                  "original": "game.exe",
                  "backup": "game.exe.bak",
              } in found

              try:
                  safe_join(root, "../escape.txt")
                  raise AssertionError("safe_join allowed path traversal")
              except ValueError:
                  pass

              outside = os.path.abspath(os.path.join(root, "..", "outside.txt"))
              try:
                  record_change(root, outside, None)
                  raise AssertionError("record_change allowed a path outside the selected root")
              except ValueError:
                  pass

              same = {
                  "original": "game.exe",
                  "backup": "game.exe",
              }
              result = restore_entries(root, [same])
              assert result["restored"] == []
              assert result["skipped"][0]["reason"] == "backup path equals original path"

          print("restore regression OK")

      - name: Regression test truthful completion status
        shell: python
        run: |
          from pathlib import Path

          source = Path("steam_auto_cracker_gui.py").read_text(encoding="utf-8")
          assert "The game has been cracked successfully!" not in source
          assert "launch compatibility has NOT been verified" in source
          assert "Restore original files" in source
          print("truthful outcome reporting regression OK")
      - name: Regression test Steam library discovery and validation
        shell: python
        run: |
          import os
          import sys
          import tempfile

          sys.path.insert(0, os.getcwd())

          from sac_lib.steam_install import (
              find_game_for_path,
              find_installed_games,
              parse_vdf,
              validate_game_folder,
          )

          sample = '"libraryfolders"\n{\n"0" { "path" "C:\\\\Steam" }\n}'
          parsed = parse_vdf(sample)
          assert parsed["libraryfolders"]["0"]["path"] == "C:\\Steam"

          with tempfile.TemporaryDirectory() as root:
              steamapps = os.path.join(root, "steamapps")
              common = os.path.join(steamapps, "common")
              game = os.path.join(common, "Example Game")
              nested = os.path.join(game, "bin", "win64")
              os.makedirs(nested)

              with open(os.path.join(nested, "steam_api64.dll"), "wb") as handle:
                  handle.write(b"test")

              with open(os.path.join(steamapps, "appmanifest_123.acf"), "w", encoding="utf-8") as handle:
                  handle.write(
                      '"AppState"\n{\n'
                      '"appid" "123"\n'
                      '"name" "Example Game"\n'
                      '"installdir" "Example Game"\n'
                      '"buildid" "456"\n'
                      '}\n'
                  )

              games = find_installed_games(extra_roots=[root])
              assert any(item["appid"] == "123" for item in games), games

              matched = find_game_for_path(game)
              assert matched and matched["appid"] == "123"
              assert matched["buildid"] == "456"

              validation = validate_game_folder(game)
              assert validation["valid"] is True
              assert len(validation["steam_api_files"]) == 1
              assert validation["steam_api_files"][0].endswith("steam_api64.dll")

          print("Steam library discovery regression OK")

      - name: Regression test verified tool updater helpers
        shell: python
        run: |
          import json
          import os
          import sys
          import tempfile

          sys.path.insert(0, os.getcwd())

          from sac_lib.tool_updater import (
              ToolUpdateError,
              _pick_asset,
              _safe_join,
              get_cached_steamless_executable,
          )

          release = {
              "assets": [
                  {"name": "wrong.zip"},
                  {"name": "Steamless-v4.3.0-windows.zip"},
              ]
          }
          picked = _pick_asset(release, ["Steamless-v4.3.0-windows.zip"])
          assert picked["name"].endswith("windows.zip")

          with tempfile.TemporaryDirectory() as root:
              try:
                  _safe_join(root, "../escape")
                  raise AssertionError("archive path traversal was accepted")
              except ToolUpdateError:
                  pass

              steamless = os.path.join(root, "steamless")
              os.makedirs(os.path.join(steamless, "bin"))
              exe = os.path.join(steamless, "bin", "Steamless.CLI.exe")
              open(exe, "wb").close()
              with open(os.path.join(steamless, "metadata.json"), "w", encoding="utf-8") as handle:
                  json.dump({"executable": os.path.join("bin", "Steamless.CLI.exe")}, handle)

              assert get_cached_steamless_executable(root) == exe

          print("verified tool updater helper regression OK")

      - name: Regression test maintenance CLI
        shell: pwsh
        run: |
          python sac_cli.py --help
          python sac_cli.py list-installed --json

      - name: Exercise portable PE version helper
        run: python -c "import os; from sac_lib.get_file_version import GetFileVersion; print(GetFileVersion(os.path.join(os.environ['WINDIR'], 'System32', 'kernel32.dll')))"

      - name: Regression test Steam AppDetails issue 124
        shell: python
        run: |
          import os
          import sys

          sys.path.insert(0, os.getcwd())

          from sac_lib.steam_store import extract_appdetails_entry

          assert extract_appdetails_entry({}, 1894430) is None

          valid = {
              "1894430": {
                  "success": True,
                  "data": {"name": "Test"},
              }
          }
          assert extract_appdetails_entry(valid, 1894430)["success"] is True

          direct_failure = {"success": False}
          assert extract_appdetails_entry(direct_failure, 1894430)["success"] is False

          print("issue #124 parser regression OK")
