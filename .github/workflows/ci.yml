name: CI

on:
  push:
    branches:
      - main
      - "best-of-forks-*"
  pull_request:

jobs:
  python-checks:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q steam_auto_cracker_gui.py sac_lib

      - name: Import portable PE version helper
        run: python -c "from sac_lib.get_file_version import GetFileVersion; print('get_file_version import OK')"
