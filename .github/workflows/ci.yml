name: CI

on:
  push:
    branches:
      - main
      - "best-of-forks-*"
  pull_request:

jobs:
  python-checks:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q steam_auto_cracker_gui.py sac_lib

      - name: Import GUI dependencies
        run: python -c "import ttkbootstrap as tk; import ttkbootstrap; from tkinterdnd2 import TkinterDnD; assert hasattr(tk, 'Text'); assert hasattr(ttkbootstrap.themes.standard, 'STANDARD_THEMES'); print('GUI dependencies OK')"

      - name: Regression test ttkbootstrap compatibility hook
        shell: python
        run: |
          import runpy
          runpy.run_path(".github/runtime_hooks/ttkbootstrap_tk_constants.py")
          import ttkbootstrap as tk
          expected = {
              "END": "end",
              "NORMAL": "normal",
              "DISABLED": "disabled",
              "LEFT": "left",
              "RIGHT": "right",
              "BOTH": "both",
              "Y": "y",
          }
          for name, value in expected.items():
              assert getattr(tk, name) == value, (name, getattr(tk, name, None))
          print("ttkbootstrap compatibility hook OK")


      - name: Regression test restore manifest and preservation
        shell: python
        run: |
          import os
          import tempfile

          from sac_lib.restore import (
              discover_legacy_backups,
              load_manifest,
              record_change,
              remove_manifest,
              restore_entries,
              safe_join,
          )

          with tempfile.TemporaryDirectory() as root:
              original = os.path.join(root, "steam_api.dll")
              backup = os.path.join(root, "steam_api.dll.bak")

              with open(original, "w", encoding="utf-8") as handle:
                  handle.write("modified")
              with open(backup, "w", encoding="utf-8") as handle:
                  handle.write("original")

              record_change(root, original, backup)
              manifest = load_manifest(root)
              assert len(manifest["entries"]) == 1

              result = restore_entries(root, manifest["entries"])
              assert result["skipped"] == []
              assert result["restored"] == ["steam_api.dll"]
              assert len(result["preserved"]) == 1

              with open(original, "r", encoding="utf-8") as handle:
                  assert handle.read() == "original"
              with open(os.path.join(root, result["preserved"][0]), "r", encoding="utf-8") as handle:
                  assert handle.read() == "modified"

              remove_manifest(root)
              assert load_manifest(root) is None

          with tempfile.TemporaryDirectory() as root:
              original = os.path.join(root, "game.exe")
              backup = original + ".bak"
              open(original, "wb").close()
              open(backup, "wb").close()

              found = discover_legacy_backups(root, exe_backup_suffix=".bak")
              assert {
                  "original": "game.exe",
                  "backup": "game.exe.bak",
              } in found

              try:
                  safe_join(root, "../escape.txt")
                  raise AssertionError("safe_join allowed path traversal")
              except ValueError:
                  pass

          print("restore regression OK")

      - name: Regression test truthful completion status
        shell: python
        run: |
          from pathlib import Path

          source = Path("steam_auto_cracker_gui.py").read_text(encoding="utf-8")
          assert "The game has been cracked successfully!" not in source
          assert "launch compatibility has NOT been verified" in source
          assert "Restore original files" in source
          print("truthful outcome reporting regression OK")
      - name: Exercise portable PE version helper
        run: python -c "import os; from sac_lib.get_file_version import GetFileVersion; print(GetFileVersion(os.path.join(os.environ['WINDIR'], 'System32', 'kernel32.dll')))"

      - name: Regression test Steam AppDetails issue 124
        shell: python
        run: |
          import os
          import sys

          sys.path.insert(0, os.getcwd())

          from sac_lib.steam_store import extract_appdetails_entry

          assert extract_appdetails_entry({}, 1894430) is None

          valid = {
              "1894430": {
                  "success": True,
                  "data": {"name": "Test"},
              }
          }
          assert extract_appdetails_entry(valid, 1894430)["success"] is True

          direct_failure = {"success": False}
          assert extract_appdetails_entry(direct_failure, 1894430)["success"] is False

          print("issue #124 parser regression OK")
