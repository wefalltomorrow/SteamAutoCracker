name: CI text fix

on:
  push:
    branches:
      - v2.4.1-steamless-result-and-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.4.1-steamless-result-and-cleanup
      - name: Update completion regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/ci.yml")
          text = path.read_text()
          text = text.replace('assert "launch compatibility has NOT been verified" in source', 'assert "classify_run_result" in source')
          path.write_text(text)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Fix completion status regression test"
          git push origin HEAD:v2.4.1-steamless-result-and-cleanup
