name: External Tool Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "tool-smoke-*"

jobs:
  verify-current-releases:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download, verify, and stage current GBE_FORK and Steamless releases
        shell: python
        run: |
          import os
          import sys
          import tempfile

          sys.path.insert(0, os.getcwd())

          from sac_lib.tool_updater import (
              get_cached_gbe_dll,
              get_cached_steamless_executable,
              update_gbe_fork,
              update_steamless,
          )

          with tempfile.TemporaryDirectory() as cache:
              gbe = update_gbe_fork(cache)
              assert gbe.get("asset_sha256")
              assert os.path.isfile(get_cached_gbe_dll(cache, "steam_api.dll"))
              assert os.path.isfile(get_cached_gbe_dll(cache, "steam_api64.dll"))
              print("GBE_FORK:", gbe)

              steamless = update_steamless(cache)
              assert steamless.get("asset_sha256")
              assert os.path.isfile(get_cached_steamless_executable(cache))
              print("Steamless:", steamless)

          print("external tool smoke OK")
